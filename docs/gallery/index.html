<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Brite Scheduler | Screenshot Gallery</title><link rel="stylesheet" href="./gallery.css"></head>
<body><header class="mast"><a href="https://github.com/qualitypro/britescheduler">Brite Scheduler</a><span>Application screenshot gallery</span></header>
<main><section class="intro"><h1>Explore Brite Scheduler</h1><p>Approved screenshots of the Owner, Contractor, and Client workspaces across desktop, tablet, and mobile.</p></section>
<div class="filters" role="group" aria-label="Screenshot filters"><label>Role <select id="role"><option value="all">All roles</option><option value="owner">Owner</option><option value="contractor">Contractor</option><option value="client">Client</option></select></label><label>Screen <select id="viewport"><option value="all">All screens</option><option value="desktop">Desktop</option><option value="tablet">Tablet</option><option value="mobile">Mobile</option></select></label><span id="count" aria-live="polite"></span></div>
<section id="gallery" class="gallery" aria-label="Screenshot thumbnails"></section><p id="empty" hidden>No approved screenshots match these filters.</p>
</main><div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Screenshot viewer" tabindex="-1"><div class="lightbox-top"><span id="lightbox-title"></span><span id="lightbox-counter"></span><button type="button" id="close" aria-label="Close screenshot viewer">✕</button></div><div class="lightbox-stage"><button type="button" id="prev" aria-label="Previous screenshot">‹</button><img id="large" alt=""><button type="button" id="next" aria-label="Next screenshot">›</button></div><p class="hint">← / → to navigate · Esc to close</p></div>
<script src="./gallery.js" defer></script></body></html>
