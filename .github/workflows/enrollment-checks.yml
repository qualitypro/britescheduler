name: Enrollment foundation checks
on:
  pull_request:
    paths:
      - 'app/Registration/**'
      - 'app/Installation/**'
      - 'migrations/038_registration_foundation.sql'
      - 'migrations/039_enrollment_rate_limits.sql'
      - 'migrations/040_registration_consents.sql'
      - 'migrations/041_registration_email_outbox.sql'
      - 'api/auth/register.php'
      - 'sign-up.v2.php'
      - 'api/enrollment_decision.php'
      - 'enrollment.php'
      - 'verify-enrollment.php'
      - 'install/index.php'
      - 'bin/brite'
      - 'tests/registration_*'
      - '.github/workflows/enrollment-checks.yml'
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI and mbstring
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mbstring php-sqlite3
      - name: Lint enrollment and installer PHP
        run: |
          set -eu
          for file in app/Registration/*.php app/Installation/*.php api/enrollment_decision.php api/auth/register.php enrollment.php sign-up.v2.php verify-enrollment.php install/index.php bin/brite tests/registration_*_test.php tests/installation_inventory_test.php; do
            php -l "$file"
          done
      - name: Pure policy and security tests
        run: |
          php tests/registration_policy_test.php
          php tests/registration_security_test.php
          php tests/registration_document_vault_test.php
          php tests/installation_inventory_test.php
          ENROLLMENT_OUTBOX_KEY=$(php -r 'echo base64_encode(str_repeat("x",32));') php tests/registration_email_envelope_test.php
